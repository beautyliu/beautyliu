<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">LiuYing 终端启动动画</title>
  <desc id="desc">模拟终端窗口的启动动画，点击可打开 LiuYing 的个人主页</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #f8fafb; stroke: #d8e0e7; stroke-width: 2; }
    .bar { fill: #f1f4f6; }
    .divider { stroke: #d8e0e7; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { fill: #526273; font-size: 18px; font-weight: 700; }
    .meta { fill: #9aa7b3; font-size: 12px; letter-spacing: .8px; }
    .line { opacity: 0; animation: reveal 8s ease-in-out infinite; }
    .l1 { animation-delay: .15s; }
    .l2 { animation-delay: .48s; }
    .l3 { animation-delay: .81s; }
    .l4 { animation-delay: 1.14s; }
    .l5 { animation-delay: 1.47s; }
    .l6 { animation-delay: 1.80s; }
    .l7 { animation-delay: 2.13s; }
    .l8 { animation-delay: 2.46s; }
    .body { fill: #566573; font-size: 16px; }
    .prompt { fill: #3478c9; font-size: 16px; font-weight: 700; }
    .ok { fill: #2f9e73; font-size: 16px; font-weight: 700; }
    .dim { fill: #9aa7b3; font-size: 15px; }
    .cursor { fill: #3478c9; animation: blink 1.1s step-end infinite; }
    @keyframes reveal {
      0% { opacity: 0; transform: translateY(4px); }
      6%, 78% { opacity: 1; transform: translateY(0); }
      88%, 100% { opacity: 0; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <rect class="window" x="1" y="1" width="998" height="518" rx="16"/>
  <path class="bar" d="M1 17A16 16 0 0 1 17 1h966a16 16 0 0 1 16 16v39H1z"/>
  <line class="divider" x1="1" y1="56" x2="999" y2="56"/>
  <circle cx="30" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="29" r="6" fill="#febc2e"/>
  <circle cx="74" cy="29" r="6" fill="#28c840"/>
  <text class="mono title" x="98" y="35">liuying@github — zsh — 100×32</text>
  <text class="mono meta" x="960" y="35" text-anchor="end">PORTFOLIO</text>

  <g class="mono">
    <text class="line l1 body" x="36" y="104"><tspan class="prompt">$</tspan> whoami</text>
    <text class="line l2 body" x="36" y="136">LiuYing · AI Product Manager</text>
    <text class="line l3 dim" x="36" y="168"># 营销策划背景，做 AI 产品，也写立项报告与产品定义</text>
    <text class="line l4 body" x="36" y="210"><tspan class="prompt">$</tspan> cat focus.txt</text>
    <text class="line l5 body" x="36" y="242">需求拆解 → 场景判断 → 可量化的验收标准</text>
    <text class="line l6 body" x="36" y="284"><tspan class="prompt">$</tspan> open portfolio</text>
    <text class="line l7 ok" x="36" y="316">✓ 个人主页已就绪</text>
    <text class="line l8 dim" x="36" y="358">点击本窗口 → 查看完整介绍与作品</text>
    <text class="prompt" x="36" y="420">$</text>
    <rect class="cursor" x="56" y="406" width="10" height="20"/>
  </g>

  <text class="mono dim" x="36" y="486" font-size="13">beautyliu.github.io/personal-site</text>
</svg>
