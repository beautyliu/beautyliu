<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">头像</title>
  <desc id="d">动漫风格的女性头像插画</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c7ff"/>
      <stop offset="0.55" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#ffc9e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3f2a55"/>
      <stop offset="0.45" stop-color="#5b3a72"/>
      <stop offset="1" stop-color="#2c1c3d"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0.3" y1="0" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#8f6bb0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8f6bb0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff2ea"/>
      <stop offset="0.6" stop-color="#ffe2d3"/>
      <stop offset="1" stop-color="#f7c9b6"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ecff"/>
    </linearGradient>
    <linearGradient id="eye" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.55" stop-color="#4a6fb5"/>
      <stop offset="1" stop-color="#9fd4ff"/>
    </linearGradient>
    <clipPath id="faceClip">
      <path d="M256 138c-52 0-92 33-92 82v52c0 44 41 82 92 82s92-38 92-82v-52c0-49-40-82-92-82z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="210" r="230" fill="url(#glow)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="96" cy="108" r="4"/>
    <circle cx="430" cy="150" r="3"/>
    <circle cx="392" cy="86" r="5"/>
    <circle cx="130" cy="392" r="3.5"/>
    <circle cx="436" cy="372" r="4.5"/>
    <circle cx="72" cy="252" r="2.5"/>
  </g>

  <!-- 后发 -->
  <path d="M256 92c-88 0-146 58-146 144 0 48-14 78-26 110-8 21 8 35 28 30 12-3 20-12 26-24 6 30 14 50 24 60h188c10-10 18-30 24-60 6 12 14 21 26 24 20 5 36-9 28-30-12-32-26-62-26-110 0-86-58-144-146-144z" fill="url(#hair)"/>

  <!-- 颈部 -->
  <path d="M218 300h76v58c0 14-16 24-38 24s-38-10-38-24z" fill="#efb8a2"/>
  <path d="M218 300h76v20c-12 8-26 12-38 12s-26-4-38-12z" fill="#e3a690" opacity="0.7"/>

  <!-- 脸 -->
  <path d="M256 138c-52 0-92 33-92 82v52c0 44 41 82 92 82s92-38 92-82v-52c0-49-40-82-92-82z" fill="url(#skin)"/>

  <!-- 腮红 -->
  <g clip-path="url(#faceClip)" opacity="0.55" filter="url(#soft)">
    <ellipse cx="196" cy="268" rx="20" ry="11" fill="#ff9db4"/>
    <ellipse cx="316" cy="268" rx="20" ry="11" fill="#ff9db4"/>
  </g>

  <!-- 眉毛 -->
  <path d="M198 226c10-7 26-8 36-3" stroke="#4a3358" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M314 226c-10-7-26-8-36-3" stroke="#4a3358" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="216" cy="254" rx="20" ry="24" fill="#fffdfd"/>
    <ellipse cx="296" cy="254" rx="20" ry="24" fill="#fffdfd"/>
    <ellipse cx="216" cy="256" rx="15" ry="20" fill="url(#eye)"/>
    <ellipse cx="296" cy="256" rx="15" ry="20" fill="url(#eye)"/>
    <ellipse cx="216" cy="262" rx="7" ry="9" fill="#12203b"/>
    <ellipse cx="296" cy="262" rx="7" ry="9" fill="#12203b"/>
    <circle cx="211" cy="246" r="5.5" fill="#ffffff"/>
    <circle cx="291" cy="246" r="5.5" fill="#ffffff"/>
    <circle cx="222" cy="268" r="2.6" fill="#ffffff" opacity="0.9"/>
    <circle cx="302" cy="268" r="2.6" fill="#ffffff" opacity="0.9"/>
    <!-- 上眼线 -->
    <path d="M194 240c6-14 16-20 24-20s16 6 20 14" stroke="#2a1c38" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M318 240c-6-14-16-20-24-20s-16 6-20 14" stroke="#2a1c38" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 下眼线 -->
    <path d="M200 272c8 8 24 8 32 0" stroke="#8b6f86" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M280 272c8 8 24 8 32 0" stroke="#8b6f86" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- 鼻子 -->
  <path d="M254 286c4 4 10 4 13 0" stroke="#e0a48d" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 嘴 -->
  <path d="M240 306c7 8 23 8 30 0" stroke="#d9718a" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M247 312c5 4 12 4 17 0" fill="#f3869e" opacity="0.85"/>

  <!-- 前发（刘海） -->
  <path d="M256 104c-56 0-96 30-104 76-4 22 2 40 10 40 6 0 8-10 12-24 6-20 18-34 34-40-6 16-4 32 4 42 6 8 14 6 18-4 6-16 12-30 24-30s18 14 24 30c4 10 12 12 18 4 8-10 10-26 4-42 16 6 28 20 34 40 4 14 6 24 12 24 8 0 14-18 10-40-8-46-48-76-104-76z" fill="url(#hair)"/>
  <path d="M196 158c22-26 62-34 92-22-30 2-60 12-78 34z" fill="url(#hairLight)" opacity="0.6"/>

  <!-- 侧发 -->
  <path d="M186 246c-10 38-11 80-2 116 3 11 14 10 15-2 1-36 0-74 4-104z" fill="url(#hair)"/>
  <path d="M326 246c10 38 11 80 2 116-3 11-14 10-15-2-1-36 0-74-4-104z" fill="url(#hair)"/>

  <!-- 衣服 -->
  <path d="M168 472c8-32 34-56 66-64 8 10 14 14 22 14s14-4 22-14c32 8 58 32 66 64z" fill="url(#cloth)"/>
  <path d="M234 408c6 12 13 16 22 16s16-4 22-16c-6-4-14-6-22-6s-16 2-22 6z" fill="#e8efff"/>
  <path d="M226 412c-6 12-8 26-6 40M286 412c6 12 8 26 6 40" stroke="#d3defa" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 发饰：小星星 -->
  <path d="M368 176l7 16 17 2-13 12 4 17-15-9-15 9 4-17-13-12 17-2z" fill="#ffe27a"/>

  <!-- 高光 -->
  <circle cx="150" cy="180" r="6" fill="#ffffff" opacity="0.85"/>
</svg>
